<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Santê • Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-emerald-600"></div>
        <div class="font-semibold">Configurações</div>
      </div>
      <a href="index.html" class="px-3 py-1.5 text-sm rounded-lg border bg-white hover:bg-slate-50">Voltar</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-6">
    <!-- Conexões -->
    <section class="bg-white border rounded-2xl p-4">
      <h2 class="font-semibold mb-3">Conexões</h2>

      <label class="block text-sm mb-1">SUPABASE_URL</label>
      <input id="supabaseUrl" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="https://xyzcompany.supabase.co" />

      <label class="block text-sm mb-1">SUPABASE_ANON_KEY</label>
      <input id="supabaseAnon" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="chave pública (anon) da Supabase" />

      <label class="block text-sm mb-1">STORE_ID (UUID)</label>
      <input id="storeId" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />

      <label class="block text-sm mb-1">API_BASE (opcional)</label>
      <input id="apiBase" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="Ex.: https://seu-dominio.vercel.app" />

      <div class="flex gap-2">
        <button id="saveBtn" class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">Salvar</button>
        <button id="testBtn" class="px-4 py-2 rounded-lg border bg-white hover:bg-slate-50">Testar conexões</button>
      </div>
      <p id="status" class="text-sm text-slate-500 mt-2">—</p>
    </section>

    <!-- Loja -->
    <section class="bg-white border rounded-2xl p-4">
      <h2 class="font-semibold mb-3">Loja</h2>

      <label class="block text-sm mb-1">Mensagem de Ausente</label>
      <textarea id="awayMsg" rows="3" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="Estamos fora do horário. Deixe sua mensagem e retornaremos assim que possível."></textarea>

      <label class="block text-sm mb-1">Limite por minuto</label>
      <input id="rateLimit" type="number" min="1" class="w-full px-3 py-2 rounded-lg border mb-3" placeholder="20" />

      <label class="block text-sm mb-1">Horário comercial (JSON)</label>
      <textarea id="bizHours" rows="4" class="w-full px-3 py-2 rounded-lg border font-mono text-xs" placeholder='{"mon":"09:00-18:00","sat":"09:00-13:00"}'></textarea>

      <div class="flex gap-2">
        <button id="saveStoreBtn" class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">Salvar loja</button>
        <button id="disconnectBtn" class="px-4 py-2 rounded-lg border bg-white hover:bg-slate-50">Desconectar WhatsApp</button>
      </div>
      <p id="storeStatus" class="text-sm text-slate-500 mt-2">—</p>
    </section>
  </main>

  <script>
    const $ = (s)=>document.querySelector(s);
    const cfg = {
      get supabaseUrl(){ return localStorage.getItem('SUPABASE_URL') || ''; },
      set supabaseUrl(v){ localStorage.setItem('SUPABASE_URL', v||''); },
      get supabaseAnon(){ return localStorage.getItem('SUPABASE_ANON_KEY') || ''; },
      set supabaseAnon(v){ localStorage.setItem('SUPABASE_ANON_KEY', v||''); },
      get storeId(){ return localStorage.getItem('STORE_ID') || ''; },
      set storeId(v){ localStorage.setItem('STORE_ID', v||''); },
      get apiBase(){ return localStorage.getItem('API_BASE') || ''; },
      set apiBase(v){ localStorage.setItem('API_BASE', v||''); },
    };

    function load(){
      $('#supabaseUrl').value = cfg.supabaseUrl;
      $('#supabaseAnon').value = cfg.supabaseAnon;
      $('#storeId').value = cfg.storeId;
      $('#apiBase').value = cfg.apiBase;
      // tenta carregar dados da loja (se existir endpoint GET /api/stores)
      // deixamos manual por enquanto
    }

    function save(){
      cfg.supabaseUrl = $('#supabaseUrl').value.trim();
      cfg.supabaseAnon = $('#supabaseAnon').value.trim();
      cfg.storeId = $('#storeId').value.trim();
      cfg.apiBase = $('#apiBase').value.trim();
      $('#status').textContent = 'Configurações salvas!';
    }

    async function test(){
      const base = cfg.apiBase || '';
      $('#status').textContent = 'Testando...';
      try{
        const r = await fetch(base+'/api/health');
        if(r.ok){ $('#status').textContent = 'API OK ✅'; }
        else { $('#status').textContent = 'API respondeu com erro ❌'; }
      }catch(e){ $('#status').textContent = 'Falha ao alcançar a API ❌'; }
    }

    async function saveStore(){
      const base = cfg.apiBase || '';
      const body = {
        store_id: cfg.storeId,
        away_message: $('#awayMsg').value,
        rate_limit_per_min: Number($('#rateLimit').value||20) || 20,
        business_hours: tryParse($('#bizHours').value)
      };
      $('#storeStatus').textContent = 'Salvando...';
      try{
        const r = await fetch(base+'/api/stores', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        $('#storeStatus').textContent = r.ok ? 'Loja salva ✅' : 'Erro ao salvar loja ❌';
      }catch(e){
        $('#storeStatus').textContent = 'Falha de rede ao salvar loja ❌';
      }
    }

    async function disconnect(){
      const base = cfg.apiBase || '';
      $('#storeStatus').textContent = 'Desconectando...';
      try{
        const r = await fetch(base+'/api/sessions/disconnect', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ store_id: cfg.storeId }) });
        $('#storeStatus').textContent = r.ok ? 'Sessão desconectada ✅' : 'Erro ao desconectar ❌';
      }catch(e){
        $('#storeStatus').textContent = 'Falha ao desconectar ❌';
      }
    }

    function tryParse(txt){
      try{ return JSON.parse(txt || '{}'); }catch(_){ return {}; }
    }

    document.getElementById('saveBtn').onclick = save;
    document.getElementById('testBtn').onclick = test;
    document.getElementById('saveStoreBtn').onclick = saveStore;
    document.getElementById('disconnectBtn').onclick = disconnect;

    load();
  </script>
</body>
</html>
